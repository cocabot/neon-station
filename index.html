<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>NEON STATION ⟡ 軌道ステーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f;
  --bg2:#0a0e22;
  --cyan:#26e3ff;
  --cyan-dim:#1aa6c7;
  --magenta:#ff2bd6;
  --magenta-dim:#b3179a;
  --lime:#8dff6b;
  --gold:#ffd25a;
  --ink:#cfe9ff;
  --ink-dim:#6b86a8;
  --panel:rgba(13,20,46,.72);
  --panel-line:rgba(38,227,255,.18);
  --good:#8dff6b;
  --bad:#ff5d6c;
  --r:14px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Chakra Petch',system-ui,sans-serif;
  overflow:hidden;
  position:fixed;inset:0;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
canvas#stars{position:fixed;inset:0;z-index:0;display:block;}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(40vw 40vw at 18% 12%, rgba(255,43,214,.16), transparent 60%),
   radial-gradient(46vw 46vw at 86% 28%, rgba(38,227,255,.16), transparent 62%),
   radial-gradient(60vw 50vw at 50% 110%, rgba(38,227,255,.10), transparent 60%);
  filter:blur(6px);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translateY(-10px) scale(1.02);}to{transform:translateY(10px) scale(1.06);}}
.scan{position:fixed;inset:0;z-index:60;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);}
.vig{position:fixed;inset:0;z-index:59;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.65) 100%);}

#app{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);}

/* ---------- HUD ---------- */
header{flex:0 0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.brand{font-family:'Michroma',sans-serif;font-size:.72rem;letter-spacing:.18em;
  color:var(--cyan);text-shadow:0 0 12px rgba(38,227,255,.55);display:flex;align-items:center;gap:7px;}
.brand b{color:var(--magenta);text-shadow:0 0 12px rgba(255,43,214,.55);}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--panel-line);
  background:var(--panel);color:var(--cyan);font-size:1rem;display:grid;place-items:center;cursor:pointer;}
.iconbtn:active{transform:scale(.92);}

.readout{margin-top:10px;text-align:center;position:relative;}
.energy{font-family:'Chakra Petch';font-weight:700;font-size:2.55rem;line-height:1;
  letter-spacing:.01em;color:#eafcff;text-shadow:0 0 18px rgba(38,227,255,.6),0 0 4px rgba(38,227,255,.9);}
.energy .u{font-size:1.1rem;color:var(--cyan);margin-left:6px;vertical-align:.35em;letter-spacing:.05em;}
.persec{margin-top:3px;font-size:.92rem;color:var(--lime);text-shadow:0 0 10px rgba(141,255,107,.5);}
.subline{margin-top:2px;font-size:.66rem;letter-spacing:.22em;color:var(--ink-dim);text-transform:uppercase;}

/* ---------- CORE ---------- */
.stage{flex:1 1 auto;display:grid;place-items:center;position:relative;min-height:170px;}
#orbit{position:absolute;inset:0;margin:auto;width:230px;height:230px;animation:spin 26s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.sat{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;
  background:rgba(8,14,34,.85);border:1px solid var(--panel-line);
  box-shadow:0 0 10px rgba(38,227,255,.35);}

.core-wrap{position:relative;width:188px;height:188px;display:grid;place-items:center;cursor:pointer;}
.ring{position:absolute;border-radius:50%;}
.ring.r1{inset:0;border:2px solid rgba(38,227,255,.35);box-shadow:0 0 24px rgba(38,227,255,.25) inset;
  background:conic-gradient(from 0deg,transparent,rgba(38,227,255,.22),transparent 35%,transparent 60%,rgba(255,43,214,.2),transparent);
  animation:spin 9s linear infinite;}
.ring.r2{inset:20px;border:1px dashed rgba(255,43,214,.45);animation:spin 14s linear infinite reverse;}
.ring.r3{inset:34px;border:1px solid rgba(38,227,255,.25);}
.core{position:relative;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#bff6ff 0%,#36d6ff 26%,#1786c9 55%,#0a2d5e 100%);
  box-shadow:0 0 40px rgba(38,227,255,.65),0 0 90px rgba(38,227,255,.35),inset 0 0 26px rgba(255,255,255,.5);
  display:grid;place-items:center;transition:transform .06s ease;}
.core::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);}
.core .glyph{font-size:2.2rem;filter:drop-shadow(0 0 6px rgba(0,0,0,.4));}
.core.pulse{animation:pulse .28s ease;}
@keyframes pulse{0%{transform:scale(1);}40%{transform:scale(.9);}100%{transform:scale(1);}}
.tap-hint{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:.62rem;
  letter-spacing:.3em;color:var(--ink-dim);text-transform:uppercase;animation:blink 2.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:.9;}}

.float{position:fixed;z-index:40;pointer-events:none;font-weight:700;font-size:1.15rem;
  color:#eafcff;text-shadow:0 0 10px rgba(38,227,255,.8);animation:floatUp .9s ease-out forwards;}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}
  18%{opacity:1;}100%{opacity:0;transform:translate(-50%,-160%) scale(1.05);}}
.spark{position:fixed;z-index:39;pointer-events:none;width:7px;height:7px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:spark .6s ease-out forwards;}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);}}

/* ---------- PANEL ---------- */
.tabs{flex:0 0 auto;display:flex;gap:6px;margin-bottom:8px;}
.tab{flex:1;padding:9px 4px;border-radius:11px 11px 0 0;border:1px solid var(--panel-line);
  border-bottom:none;background:rgba(10,16,38,.55);color:var(--ink-dim);font-weight:600;
  font-size:.78rem;letter-spacing:.06em;text-align:center;cursor:pointer;position:relative;}
.tab .badge{position:absolute;top:3px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--magenta);color:#fff;font-size:.6rem;line-height:16px;box-shadow:0 0 8px rgba(255,43,214,.6);}
.tab.active{color:var(--cyan);background:var(--panel);text-shadow:0 0 10px rgba(38,227,255,.5);}
.tab.active::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:2px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan);}

.panel{flex:0 0 44vh;max-height:44vh;border:1px solid var(--panel-line);border-radius:0 0 var(--r) var(--r);
  background:var(--panel);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:flex;flex-direction:column;overflow:hidden;}
.panel .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-bottom:1px solid var(--panel-line);}
.panel .bar .ttl{font-size:.66rem;letter-spacing:.22em;color:var(--ink-dim);text-transform:uppercase;}
.buyamt{display:flex;gap:4px;}
.buyamt button{padding:4px 9px;border-radius:8px;border:1px solid var(--panel-line);
  background:transparent;color:var(--ink-dim);font-family:inherit;font-weight:600;font-size:.72rem;cursor:pointer;}
.buyamt button.on{color:#05060f;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(38,227,255,.5);}
.list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:8px;display:flex;flex-direction:column;gap:7px;}
.list::-webkit-scrollbar{width:5px;}
.list::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:3px;}

.card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  border:1px solid rgba(38,227,255,.14);background:linear-gradient(100deg,rgba(20,30,64,.6),rgba(12,18,42,.5));
  position:relative;overflow:hidden;cursor:pointer;transition:transform .08s,border-color .15s;}
.card:active{transform:scale(.985);}
.card.locked{opacity:.45;filter:grayscale(.4);}
.card.afford{border-color:rgba(141,255,107,.5);box-shadow:0 0 14px rgba(141,255,107,.12);}
.card .ic{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:1.4rem;
  background:radial-gradient(circle at 40% 35%,rgba(38,227,255,.25),rgba(8,14,34,.9));
  border:1px solid var(--panel-line);}
.card .mid{flex:1 1 auto;min-width:0;}
.card .nm{font-weight:600;font-size:.92rem;color:#eafcff;display:flex;align-items:center;gap:6px;}
.card .nm .cnt{font-size:.7rem;color:var(--cyan);background:rgba(38,227,255,.12);
  border:1px solid var(--panel-line);border-radius:7px;padding:0 6px;}
.card .de{font-size:.72rem;color:var(--ink-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .rt{flex:0 0 auto;text-align:right;}
.card .cost{font-weight:700;font-size:.9rem;color:var(--gold);text-shadow:0 0 8px rgba(255,210,90,.4);}
.card.afford .cost{color:var(--lime);text-shadow:0 0 8px rgba(141,255,107,.5);}
.card .costu{font-size:.62rem;color:var(--ink-dim);letter-spacing:.1em;}
.empty{margin:auto;color:var(--ink-dim);font-size:.82rem;text-align:center;line-height:1.7;padding:18px;}

/* warp tab */
.warp{padding:14px;display:flex;flex-direction:column;gap:12px;text-align:center;}
.warp .big{font-family:'Michroma';font-size:1.1rem;color:var(--magenta);letter-spacing:.1em;
  text-shadow:0 0 14px rgba(255,43,214,.5);}
.warp p{margin:0;font-size:.82rem;color:var(--ink-dim);line-height:1.7;}
.shardline{font-size:1rem;color:var(--gold);font-weight:700;}
.shardline b{color:#eafcff;}
.warpbtn{margin-top:4px;padding:13px;border-radius:12px;border:1px solid var(--magenta);
  background:linear-gradient(100deg,rgba(255,43,214,.25),rgba(255,43,214,.08));
  color:#ffd6f6;font-family:'Chakra Petch';font-weight:700;font-size:1rem;letter-spacing:.1em;cursor:pointer;
  text-shadow:0 0 10px rgba(255,43,214,.6);box-shadow:0 0 22px rgba(255,43,214,.25);}
.warpbtn:disabled{opacity:.4;border-color:var(--ink-dim);box-shadow:none;color:var(--ink-dim);text-shadow:none;}
.warpbtn:active:not(:disabled){transform:scale(.97);}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;
  background:rgba(3,5,14,.78);backdrop-filter:blur(4px);padding:22px;}
.modal.show{display:grid;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:360px;border:1px solid var(--panel-line);border-radius:18px;
  background:linear-gradient(160deg,rgba(16,24,54,.96),rgba(8,12,30,.96));padding:20px;
  box-shadow:0 0 40px rgba(38,227,255,.18);text-align:center;}
.sheet h2{font-family:'Michroma';font-size:1rem;letter-spacing:.08em;color:var(--cyan);margin:0 0 10px;
  text-shadow:0 0 12px rgba(38,227,255,.5);}
.sheet p{font-size:.86rem;color:var(--ink);line-height:1.75;margin:6px 0;}
.sheet .gain{font-size:1.5rem;font-weight:700;color:var(--lime);text-shadow:0 0 12px rgba(141,255,107,.5);margin:8px 0;}
.sheet .row{display:flex;gap:8px;margin-top:14px;}
.sheet button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--panel-line);
  background:var(--panel);color:var(--ink);font-family:inherit;font-weight:600;font-size:.86rem;cursor:pointer;}
.sheet button.pri{background:var(--cyan);color:#05060f;border-color:var(--cyan);box-shadow:0 0 14px rgba(38,227,255,.4);}
.sheet button.danger{color:var(--bad);border-color:rgba(255,93,108,.5);}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;
  border-bottom:1px solid rgba(38,227,255,.1);font-size:.9rem;}
.toggle{width:48px;height:26px;border-radius:14px;border:1px solid var(--panel-line);background:rgba(8,14,34,.8);
  position:relative;cursor:pointer;transition:background .2s;}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--ink-dim);transition:.2s;}
.toggle.on{background:rgba(38,227,255,.3);}
.toggle.on::after{left:24px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}

.warp-flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#fff,rgba(255,43,214,.6) 30%,transparent 70%);}
.warp-flash.go{animation:warpf 1s ease-out;}
@keyframes warpf{0%{opacity:0;transform:scale(.2);}30%{opacity:1;}100%{opacity:0;transform:scale(2.4);}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>

<div id="app">
  <header>
    <div class="topbar">
      <div class="brand">◢&nbsp; NEON&nbsp;<b>STATION</b> &nbsp;◣</div>
      <div class="iconbtn" id="gear">⚙</div>
    </div>
    <div class="readout">
      <div class="energy"><span id="enVal">0</span><span class="u" id="enUnit">EN</span></div>
      <div class="persec" id="persec">+0 EN/s</div>
      <div class="subline" id="stationName">STATION&nbsp;NOVA-7 · LV.0</div>
    </div>
  </header>

  <div class="stage">
    <div id="orbit"></div>
    <div class="core-wrap" id="coreWrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core" id="core"><span class="glyph">⚡</span></div>
      <div class="tap-hint">TAP TO MINE</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="modules">モジュール</div>
    <div class="tab" data-tab="upgrades">強化<span class="badge" id="upgBadge" style="display:none">0</span></div>
    <div class="tab" data-tab="warp">ワープ<span class="badge" id="warpBadge" style="display:none">!</span></div>
  </div>

  <div class="panel">
    <div class="bar" id="panelBar">
      <span class="ttl" id="panelTtl">自動マイニング・モジュール</span>
      <div class="buyamt" id="buyAmt">
        <button data-amt="1" class="on">×1</button>
        <button data-amt="10">×10</button>
        <button data-amt="max">MAX</button>
      </div>
    </div>
    <div class="list" id="modList"></div>
    <div class="list" id="upgList" style="display:none"></div>
    <div class="warp" id="warpPane" style="display:none"></div>
  </div>
</div>

<div class="scan"></div>
<div class="vig"></div>
<div class="warp-flash" id="warpFlash"></div>

<!-- offline modal -->
<div class="modal" id="offlineModal">
  <div class="sheet">
    <h2>⟡ おかえりなさい</h2>
    <p id="offlineTime">離れていた時間</p>
    <div class="gain" id="offlineGain">+0 EN</div>
    <p style="font-size:.74rem;color:var(--ink-dim)">ステーションは留守中も稼働していました</p>
    <div class="row"><button class="pri" onclick="closeOffline()">回収する</button></div>
  </div>
</div>

<!-- settings modal -->
<div class="modal" id="setModal">
  <div class="sheet">
    <h2>⚙ システム設定</h2>
    <div class="set-item"><span>サウンド</span><div class="toggle" id="sndToggle"></div></div>
    <div class="set-item"><span>触覚フィードバック</span><div class="toggle on" id="vibToggle"></div></div>
    <div class="set-item" style="border:none;flex-direction:column;align-items:stretch;gap:8px">
      <span style="font-size:.74rem;color:var(--ink-dim);text-align:left">統計</span>
      <div id="statBox" style="font-size:.8rem;color:var(--ink);text-align:left;line-height:1.9"></div>
    </div>
    <div class="row">
      <button onclick="manualSave()">今すぐ保存</button>
      <button onclick="closeSettings()" class="pri">閉じる</button>
    </div>
    <div class="row"><button class="danger" onclick="hardReset()">セーブを全消去</button></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   NEON STATION — neon-cyber space-station idle clicker
   single file · vanilla JS · localStorage save
   ============================================================ */

const SAVE_KEY = 'neon-station-v1';
const R = 1.15;                 // cost growth per purchase
const OFFLINE_CAP_H = 8;        // max hours of offline accrual

/* ---- module definitions ---- */
const MODULES = [
  {id:'solar',  icon:'☀️', name:'ソーラーパネル', baseCost:15,        prod:0.1},
  {id:'drone',  icon:'🛰️', name:'採掘ドローン',   baseCost:100,       prod:1},
  {id:'habitat',icon:'🏙️', name:'居住モジュール', baseCost:1100,      prod:8},
  {id:'lab',    icon:'🔬', name:'研究ラボ',       baseCost:12000,     prod:47},
  {id:'fusion', icon:'☢️', name:'核融合炉',       baseCost:130000,    prod:260},
  {id:'quantum',icon:'🔮', name:'量子コア',       baseCost:1400000,   prod:1400},
  {id:'dyson',  icon:'💠', name:'ダイソン環',     baseCost:20000000,  prod:7800},
  {id:'worm',   icon:'🌀', name:'ワームホール',   baseCost:330000000, prod:44000},
];

/* ---- upgrades (built once) ---- */
function buildUpgrades(){
  const up = [];
  // tap tiers — sequential unlock
  const tapTiers = [
    {name:'強化外骨格',   factor:2, cost:1000},
    {name:'ナノ・グローブ', factor:2, cost:18000},
    {name:'プラズマ・タップ',factor:3, cost:260000},
    {name:'重力プレス',    factor:3, cost:4000000},
    {name:'特異点グリップ', factor:4, cost:6e7},
  ];
  tapTiers.forEach((t,i)=>{
    up.push({id:'tap'+i, name:t.name, desc:'タップ威力 ×'+t.factor, cost:t.cost,
      eff:{kind:'tap',factor:t.factor},
      unlock:()=> i===0 ? true : S.bought.has('tap'+(i-1)) });
  });
  // per-module milestone upgrades ×2 at owned thresholds
  const miles=[10,25,50,100,150];
  MODULES.forEach((m,idx)=>{
    miles.forEach(ms=>{
      up.push({
        id:'m'+idx+'_'+ms,
        name:m.name+' 最適化',
        desc:m.name+'の出力 ×2（保有'+ms+'）',
        cost: Math.ceil(m.baseCost*ms*9),
        eff:{kind:'module',idx,factor:2},
        unlock:()=> S.mods[idx]>=ms,
      });
    });
  });
  // global synergy upgrades
  const totalOwned=()=>S.mods.reduce((a,b)=>a+b,0);
  up.push({id:'g_ai',  name:'ステーションAI', desc:'全モジュール出力 ×2', cost:5e6,
    eff:{kind:'global',factor:2}, unlock:()=> totalOwned()>=80});
  up.push({id:'g_od',  name:'オーバードライブ', desc:'全モジュール出力 ×2', cost:2.5e8,
    eff:{kind:'global',factor:2}, unlock:()=> totalOwned()>=160});
  up.push({id:'g_sing',name:'特異点ネットワーク', desc:'全モジュール出力 ×3', cost:1e10,
    eff:{kind:'global',factor:3}, unlock:()=> totalOwned()>=260});
  return up;
}

/* ---- state ---- */
const FRESH = () => ({
  energy:0,            // current energy
  lifetime:0,         // all-time energy earned (across warps)
  runEarned:0,        // energy earned this run (for warp calc)
  shards:0,           // prestige currency
  warps:0,            // number of warps done
  taps:0,             // total taps
  mods: MODULES.map(()=>0),
  bought: new Set(),
  buyAmt:'1',
  snd:false,
  vib:true,
  last: Date.now(),
  started: Date.now(),
});
let S = FRESH();
let UPG = [];

/* ---- derived multipliers (recomputed from bought set) ---- */
let M_MULT=[], G_MULT=1, TAP_MULT=1;
function recompute(){
  M_MULT = MODULES.map(()=>1); G_MULT=1; TAP_MULT=1;
  S.bought.forEach(id=>{
    const u = UPG.find(x=>x.id===id); if(!u) return;
    const e=u.eff;
    if(e.kind==='module') M_MULT[e.idx]*=e.factor;
    else if(e.kind==='global') G_MULT*=e.factor;
    else if(e.kind==='tap') TAP_MULT*=e.factor;
  });
}
const prestigeMult = () => 1 + S.shards*0.02;            // +2% per shard
function perSec(){
  let s=0;
  for(let i=0;i<MODULES.length;i++) s += S.mods[i]*MODULES[i].prod*M_MULT[i];
  return s*G_MULT*prestigeMult();
}
function tapValue(){ return 1*TAP_MULT*prestigeMult(); }

/* ---- number formatting ---- */
const UNITS=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000){ const r=Math.round(n*10)/10; return (r%1===0?r.toFixed(0):r.toFixed(1)); }
  const tier=Math.floor(Math.log10(n)/3);
  if(tier>=UNITS.length) return n.toExponential(2).replace('+','');
  const v=n/Math.pow(10,tier*3);
  return (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,'')+UNITS[tier];
}

/* ---- cost math (geometric) ---- */
function costOf(idx,n){
  const owned=S.mods[idx], base=MODULES[idx].baseCost;
  return Math.ceil(base*Math.pow(R,owned)*(Math.pow(R,n)-1)/(R-1));
}
function maxBuy(idx){
  const owned=S.mods[idx], base=MODULES[idx].baseCost;
  const k=Math.floor(Math.log( (S.energy*(R-1))/(base*Math.pow(R,owned)) + 1 )/Math.log(R));
  return Math.max(0,k);
}
function wantN(idx){
  if(S.buyAmt==='max'){ return Math.max(1,maxBuy(idx)); }
  return parseInt(S.buyAmt,10);
}

/* ============================================================
   RENDERING
   ============================================================ */
const $ = s=>document.querySelector(s);
const enVal=$('#enVal'), persecEl=$('#persec'), stationName=$('#stationName');
const modList=$('#modList'), upgList=$('#upgList'), warpPane=$('#warpPane');
const upgBadge=$('#upgBadge'), warpBadge=$('#warpBadge');

let modRows=[]; // cached refs
function buildModList(){
  modList.innerHTML='';
  modRows=[];
  MODULES.forEach((m,idx)=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=
      `<div class="ic">${m.icon}</div>
       <div class="mid">
         <div class="nm">${m.name}<span class="cnt" data-cnt>×0</span></div>
         <div class="de" data-de>+${fmt(m.prod)} EN/s</div>
       </div>
       <div class="rt">
         <div class="cost" data-cost>0</div>
         <div class="costu">買う <span data-qty>×1</span></div>
       </div>`;
    card.addEventListener('click',()=>buy(idx));
    modList.appendChild(card);
    modRows.push({card, cnt:card.querySelector('[data-cnt]'), de:card.querySelector('[data-de]'),
      cost:card.querySelector('[data-cost]'), qty:card.querySelector('[data-qty]')});
  });
}
function unlockedModule(idx){
  if(idx===0) return true;
  // reveal a module once you can almost afford it (or own the previous)
  return S.mods[idx-1]>0 || S.energy >= MODULES[idx].baseCost*0.4 || S.mods[idx]>0;
}
function updateModList(){
  for(let idx=0;idx<MODULES.length;idx++){
    const r=modRows[idx], owned=S.mods[idx];
    if(!unlockedModule(idx)){ r.card.style.display='none'; continue; }
    r.card.style.display='';
    const n=wantN(idx), cost=costOf(idx,n), afford=S.energy>=cost && (S.buyAmt!=='max' || maxBuy(idx)>0);
    r.cnt.textContent='×'+owned;
    const each = MODULES[idx].prod*M_MULT[idx]*G_MULT*prestigeMult();
    r.de.textContent = owned>0
      ? `稼働 +${fmt(each*owned)} /s （1基 ${fmt(each)}）`
      : `+${fmt(each)} EN/s（1基あたり）`;
    r.cost.textContent=fmt(cost);
    r.qty.textContent = S.buyAmt==='max' ? '×'+n : '×'+n;
    r.card.classList.toggle('afford',afford);
    r.card.classList.toggle('locked',!afford);
  }
}

let upgSig='';
function updateUpgList(force){
  const avail = UPG.filter(u=>!S.bought.has(u.id) && u.unlock()).sort((a,b)=>a.cost-b.cost);
  const sig = avail.map(u=>u.id).join(',');
  // badge = affordable count
  const affordCount = avail.filter(u=>S.energy>=u.cost).length;
  upgBadge.style.display = affordCount>0 ? '' : 'none';
  upgBadge.textContent = affordCount;
  if(sig!==upgSig || force){
    upgSig=sig;
    upgList.innerHTML='';
    if(avail.length===0){
      upgList.innerHTML='<div class="empty">利用可能な強化はまだありません。<br>モジュールを増やすと解放されます。</div>';
    }else{
      avail.forEach(u=>{
        const card=document.createElement('div'); card.className='card'; card.dataset.uid=u.id;
        card.innerHTML=
          `<div class="ic">⬆️</div>
           <div class="mid"><div class="nm">${u.name}</div><div class="de">${u.desc}</div></div>
           <div class="rt"><div class="cost" data-cost>${fmt(u.cost)}</div><div class="costu">強化</div></div>`;
        card.addEventListener('click',()=>buyUpgrade(u.id));
        upgList.appendChild(card);
      });
    }
  }
  // refresh affordability on existing cards
  [...upgList.children].forEach(card=>{
    const u=UPG.find(x=>x.id===card.dataset.uid); if(!u) return;
    const af=S.energy>=u.cost;
    card.classList.toggle('afford',af);
    card.classList.toggle('locked',!af);
  });
}

function warpProjection(){
  // shards from this run's earnings: sqrt(runEarned/1e6)
  return Math.floor(Math.sqrt(S.runEarned/1e6));
}
function buildWarpPane(){
  const proj=warpProjection();
  const can=proj>0;
  const cur=(S.shards*2);
  warpBadge.style.display = can ? '' : 'none';
  warpPane.innerHTML=
    `<div class="big">⟡ ワープ航行 ⟡</div>
     <p>ステーションを次元転送し、すべてをリセットします。<br>代わりに <b style="color:var(--gold)">コア・シャード</b> を獲得し、永続的に全生産が強化されます。</p>
     <div class="shardline">保有シャード <b>${S.shards}</b> &nbsp;→&nbsp; 生産 +${cur}%</div>
     <div class="shardline" style="color:var(--lime)">今ワープすると <b style="color:var(--lime)">+${proj}</b> シャード獲得</div>
     <p style="font-size:.72rem">${can?('ワープ後の生産ボーナス: +'+((S.shards+proj)*2)+'%'):('あと '+fmt(Math.max(0,1e6 - S.runEarned))+' EN 稼ぐと初回ワープ可能（このラン累計 '+fmt(S.runEarned)+'）')}</p>
     <button class="warpbtn" id="warpBtn" ${can?'':'disabled'}>ワープを実行</button>`;
  const b=$('#warpBtn'); if(b) b.addEventListener('click',doWarp);
}

/* ============================================================
   ACTIONS
   ============================================================ */
function buy(idx){
  const n=wantN(idx), cost=costOf(idx,n);
  if(S.energy<cost) { flashCard(modRows[idx].card); return; }
  S.energy-=cost; S.mods[idx]+=n;
  recompute(); updateModList(); updateUpgList(); updateSatellites(); pingHud();
  blip(420,0.04);
}
function buyUpgrade(id){
  const u=UPG.find(x=>x.id===id); if(!u||S.bought.has(id)) return;
  if(S.energy<u.cost){ const c=[...upgList.children].find(x=>x.dataset.uid===id); if(c)flashCard(c); return; }
  S.energy-=u.cost; S.bought.add(id);
  recompute(); updateUpgList(true); updateModList(); pingHud();
  blip(660,0.05);
}
function flashCard(card){ card.animate(
  [{borderColor:'rgba(255,93,108,.9)'},{borderColor:''}],{duration:380});
}

function doWarp(){
  const proj=warpProjection(); if(proj<=0) return;
  $('#warpFlash').classList.remove('go'); void $('#warpFlash').offsetWidth; $('#warpFlash').classList.add('go');
  vibrate(40); blip(180,0.12,'saw');
  setTimeout(()=>{
    S.shards+=proj; S.warps+=1;
    S.energy=0; S.runEarned=0;
    S.mods=MODULES.map(()=>0);
    S.bought=new Set();
    recompute(); buildModList(); updateModList(); updateUpgList(true); updateSatellites();
    buildWarpPane(); pingHud(); save();
  },550);
}

/* ---- tap ---- */
const core=$('#core'), coreWrap=$('#coreWrap');
function onTap(e){
  e.preventDefault();
  const v=tapValue();
  S.energy+=v; S.runEarned+=v; S.lifetime+=v; S.taps++;
  core.classList.remove('pulse'); void core.offsetWidth; core.classList.add('pulse');
  const pt = e.touches? e.touches[0] : e;
  const x = pt? pt.clientX : window.innerWidth/2;
  const y = pt? pt.clientY : window.innerHeight/2;
  spawnFloat(x,y,'+'+fmt(v));
  spawnSparks(x,y);
  vibrate(8); blip(880,0.02);
  pingHud();
}
coreWrap.addEventListener('pointerdown',onTap);

function spawnFloat(x,y,txt){
  const el=document.createElement('div'); el.className='float'; el.textContent=txt;
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function spawnSparks(x,y){
  const n=7;
  for(let i=0;i<n;i++){
    const s=document.createElement('div'); s.className='spark';
    const ang=Math.random()*Math.PI*2, d=30+Math.random()*46;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(ang)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*d)+'px');
    if(i%2) s.style.background='var(--magenta)', s.style.boxShadow='0 0 8px var(--magenta)';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),600);
  }
}

/* ---- satellites around the core ---- */
const orbit=$('#orbit');
function updateSatellites(){
  const owned=MODULES.map((m,i)=>({m,i,n:S.mods[i]})).filter(o=>o.n>0);
  orbit.innerHTML='';
  const R0=104;
  owned.forEach((o,k)=>{
    const ang=(k/owned.length)*Math.PI*2;
    const el=document.createElement('div'); el.className='sat'; el.textContent=o.m.icon;
    el.style.transform=`translate(${Math.cos(ang)*R0}px,${Math.sin(ang)*R0}px)`;
    orbit.appendChild(el);
  });
}

/* ---- HUD ---- */
let lastHud=0;
function pingHud(){ /* immediate-ish */ }
function renderHud(){
  enVal.textContent=fmt(S.energy);
  persecEl.textContent='+'+fmt(perSec())+' EN/s';
  const lv=S.mods.reduce((a,b)=>a+b,0);
  stationName.innerHTML=`STATION&nbsp;NOVA-7 · LV.${lv}` + (S.shards>0?` · <span style="color:var(--gold)">◆${S.shards}</span>`:'');
}

/* ============================================================
   GAME LOOP
   ============================================================ */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.25,(now-lastT)/1000); lastT=now;
  const gain=perSec()*dt;
  if(gain>0){ S.energy+=gain; S.runEarned+=gain; S.lifetime+=gain; }
  renderHud();
  if(now-lastHud>220){ lastHud=now; updateModList(); updateUpgList(); }
  requestAnimationFrame(loop);
}

/* ============================================================
   AUDIO (tiny WebAudio blips)
   ============================================================ */
let actx=null;
function blip(freq,gain,type){
  if(!S.snd) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'triangle'; o.frequency.value=freq;
    g.gain.value=gain; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.18);
    o.stop(actx.currentTime+0.2);
  }catch(e){}
}
function vibrate(ms){ if(S.vib && navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }

/* ============================================================
   SAVE / LOAD / OFFLINE
   ============================================================ */
function save(){
  S.last=Date.now();
  const o={...S, bought:[...S.bought]};
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(o)); }catch(e){}
}
function load(){
  let raw; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ raw=null; }
  if(!raw) return false;
  try{
    const o=JSON.parse(raw);
    S=FRESH();
    Object.assign(S,o);
    S.bought=new Set(o.bought||[]);
    S.mods=MODULES.map((m,i)=>(o.mods&&o.mods[i])||0);
    return true;
  }catch(e){ return false; }
}
function applyOffline(){
  const now=Date.now();
  const elapsed=Math.min(OFFLINE_CAP_H*3600, Math.max(0,(now-(S.last||now))/1000));
  recompute();
  const rate=perSec();
  const gain=rate*elapsed;
  if(elapsed>30 && gain>0){
    S.energy+=gain; S.runEarned+=gain; S.lifetime+=gain;
    $('#offlineTime').textContent='オフライン時間: '+fmtDur(elapsed);
    $('#offlineGain').textContent='+'+fmt(gain)+' EN';
    $('#offlineModal').classList.add('show');
  }
}
function fmtDur(sec){
  sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(h>0) return `${h}時間 ${m}分`;
  if(m>0) return `${m}分 ${s}秒`;
  return `${s}秒`;
}
function closeOffline(){ $('#offlineModal').classList.remove('show'); blip(620,0.05); }

/* ============================================================
   UI WIRING
   ============================================================ */
// tabs
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const which=t.dataset.tab;
    modList.style.display = which==='modules'?'':'none';
    upgList.style.display = which==='upgrades'?'':'none';
    warpPane.style.display= which==='warp'?'':'none';
    $('#buyAmt').style.visibility = which==='modules'?'visible':'hidden';
    $('#panelTtl').textContent = which==='modules'?'自動マイニング・モジュール'
                              : which==='upgrades'?'パワー・アップグレード':'次元ワープ・システム';
    if(which==='warp') buildWarpPane();
    if(which==='upgrades') updateUpgList(true);
    blip(520,0.03);
  });
});
// buy amount
document.querySelectorAll('#buyAmt button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#buyAmt button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); S.buyAmt=b.dataset.amt; updateModList(); blip(500,0.03);
  });
});
// settings
$('#gear').addEventListener('click',openSettings);
function openSettings(){
  $('#sndToggle').classList.toggle('on',S.snd);
  $('#vibToggle').classList.toggle('on',S.vib);
  $('#statBox').innerHTML=
    `累計採掘: <b>${fmt(S.lifetime)}</b> EN<br>`+
    `総タップ数: <b>${fmt(S.taps)}</b><br>`+
    `ワープ回数: <b>${S.warps}</b> ／ シャード <b>${S.shards}</b><br>`+
    `毎秒生産: <b>${fmt(perSec())}</b> EN/s`;
  $('#setModal').classList.add('show');
}
function closeSettings(){ $('#setModal').classList.remove('show'); }
$('#sndToggle').addEventListener('click',()=>{ S.snd=!S.snd; $('#sndToggle').classList.toggle('on',S.snd);
  if(S.snd){ actx=null; blip(700,0.05);} });
$('#vibToggle').addEventListener('click',()=>{ S.vib=!S.vib; $('#vibToggle').classList.toggle('on',S.vib); vibrate(12); });
function manualSave(){ save(); const b=event.target; const old=b.textContent; b.textContent='保存しました ✓'; setTimeout(()=>b.textContent=old,1200); }
function hardReset(){
  if(!confirm('本当にセーブを全消去しますか？この操作は取り消せません。')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  S=FRESH(); recompute(); buildModList(); updateModList(); updateUpgList(true); updateSatellites();
  closeSettings(); renderHud();
}
// close modals on backdrop tap
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); }));

/* ============================================================
   STARFIELD
   ============================================================ */
const cv=$('#stars'), cx=cv.getContext('2d');
let stars=[];
function resize(){
  cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const count=Math.min(150,Math.floor(innerWidth*innerHeight/9000));
  stars=Array.from({length:count},()=>({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    z:Math.random()*0.8+0.2, tw:Math.random()*Math.PI*2
  }));
}
function drawStars(t){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){
    s.y += s.z*0.12; if(s.y>innerHeight){ s.y=0; s.x=Math.random()*innerWidth; }
    const a=0.35+0.55*Math.abs(Math.sin(t*0.001+s.tw));
    const r=s.z*1.5;
    cx.beginPath();
    cx.fillStyle = s.z>0.7 ? `rgba(180,245,255,${a})` : `rgba(120,180,255,${a*0.8})`;
    cx.arc(s.x,s.y,r,0,Math.PI*2); cx.fill();
  }
  requestAnimationFrame(drawStars);
}
addEventListener('resize',resize);

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  UPG=buildUpgrades();
  const had=load();
  recompute();
  buildModList();
  updateSatellites();
  if(had) applyOffline();
  // restore buy amount button highlight
  document.querySelectorAll('#buyAmt button').forEach(x=>x.classList.toggle('on',x.dataset.amt===S.buyAmt));
  renderHud(); updateModList(); updateUpgList(true);
  resize(); requestAnimationFrame(drawStars);
  requestAnimationFrame(loop);
  // autosave
  setInterval(save,5000);
  addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  addEventListener('beforeunload',save);
}
boot();
</script>
</body>
