<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>NEON STATION // CORE DEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f; --cyan:#26e3ff; --magenta:#ff2bd6; --lime:#8dff6b;
  --gold:#ffd25a; --red:#ff465f; --ink:#cfe9ff; --ink-dim:#6b86a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Chakra Petch',system-ui,sans-serif;
  position:fixed; inset:0;
  user-select:none;-webkit-user-select:none; touch-action:none;
}
canvas{position:fixed;inset:0;display:block;}
#stars{z-index:0;}
#game{z-index:2;}
.nebula{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
   radial-gradient(40vw 40vw at 16% 14%, rgba(255,43,214,.14), transparent 60%),
   radial-gradient(46vw 46vw at 88% 26%, rgba(38,227,255,.14), transparent 62%),
   radial-gradient(60vw 50vw at 50% 112%, rgba(38,227,255,.10), transparent 60%);
  filter:blur(8px);}
.scan{position:fixed;inset:0;z-index:30;pointer-events:none;mix-blend-mode:overlay;opacity:.45;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);}
.vig{position:fixed;inset:0;z-index:29;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%);}
.danger{position:fixed;inset:0;z-index:28;pointer-events:none;opacity:0;
  background:radial-gradient(120% 90% at 50% 50%,transparent 50%,rgba(255,70,95,.5) 100%);
  transition:opacity .2s;}
.danger.on{animation:dpulse 1s ease-in-out infinite;}
@keyframes dpulse{0%,100%{opacity:.15;}50%{opacity:.5;}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
  display:flex;flex-direction:column;}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between;}
.score-wrap{}
.score{font-family:'Chakra Petch';font-weight:700;font-size:2.1rem;line-height:1;color:#eafcff;
  text-shadow:0 0 16px rgba(38,227,255,.6);}
.best{font-size:.66rem;letter-spacing:.18em;color:var(--ink-dim);margin-top:3px;}
.best b{color:var(--gold);}
.ctrls{display:flex;gap:8px;pointer-events:auto;}
.ic{width:38px;height:38px;border-radius:11px;border:1px solid rgba(38,227,255,.25);
  background:rgba(10,16,38,.6);color:var(--cyan);font-size:1.05rem;display:grid;place-items:center;cursor:pointer;}
.ic:active{transform:scale(.9);}
.hp{margin-top:10px;display:flex;align-items:center;gap:7px;}
.hp .lbl{font-size:.6rem;letter-spacing:.2em;color:var(--ink-dim);}
.hpbar{flex:1;max-width:230px;height:11px;border-radius:6px;border:1px solid rgba(38,227,255,.25);
  background:rgba(8,14,34,.7);overflow:hidden;position:relative;}
.hpfill{position:absolute;inset:0;width:100%;transform-origin:left;
  background:linear-gradient(90deg,var(--lime),var(--cyan));
  box-shadow:0 0 10px rgba(141,255,107,.5);transition:transform .18s,background .3s;}
.combo{margin:6px auto 0;text-align:center;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s;}
.combo.on{opacity:1;transform:scale(1);}
.combo .x{font-family:'Michroma';font-size:1.5rem;color:var(--gold);text-shadow:0 0 14px rgba(255,210,90,.6);}
.combo .c{font-size:.66rem;letter-spacing:.22em;color:var(--ink-dim);}
.wave{position:fixed;top:38%;left:0;right:0;z-index:21;text-align:center;pointer-events:none;
  font-family:'Michroma';font-size:1.4rem;letter-spacing:.2em;color:var(--cyan);
  text-shadow:0 0 20px rgba(38,227,255,.7);opacity:0;}
.wave.show{animation:waveIn 1.6s ease;}
@keyframes waveIn{0%{opacity:0;transform:scale(.6);letter-spacing:.6em;}
  20%{opacity:1;transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:scale(1.1);}}
.buffs{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:21;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.buff{font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:9px;
  background:rgba(8,14,34,.7);border:1px solid rgba(38,227,255,.3);}

/* ---------- SCREENS ---------- */
.screen{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px 26px;
  background:radial-gradient(120% 90% at 50% 40%,rgba(5,8,22,.55),rgba(3,4,12,.9));
  pointer-events:auto;}
.screen.show{display:flex;animation:fade .3s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.title{font-family:'Michroma';font-size:1.7rem;letter-spacing:.1em;color:var(--cyan);
  text-shadow:0 0 22px rgba(38,227,255,.6);line-height:1.5;}
.title b{color:var(--magenta);text-shadow:0 0 22px rgba(255,43,214,.6);}
.sub{margin-top:6px;font-size:.7rem;letter-spacing:.34em;color:var(--ink-dim);text-transform:uppercase;}
.howto{margin-top:22px;max-width:330px;font-size:.86rem;line-height:1.95;color:var(--ink);}
.howto .row{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;margin:4px 0;}
.howto .dot{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;
  border:1px solid rgba(38,227,255,.3);background:rgba(10,16,38,.6);}
.bigbtn{margin-top:28px;padding:16px 46px;border-radius:14px;border:1px solid var(--cyan);
  background:linear-gradient(100deg,rgba(38,227,255,.28),rgba(38,227,255,.08));
  color:#eafcff;font-family:'Michroma';font-size:1.05rem;letter-spacing:.12em;cursor:pointer;
  text-shadow:0 0 12px rgba(38,227,255,.7);box-shadow:0 0 28px rgba(38,227,255,.3);
  animation:pulseBtn 1.8s ease-in-out infinite;}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 24px rgba(38,227,255,.25);}50%{box-shadow:0 0 40px rgba(38,227,255,.5);}}
.bigbtn:active{transform:scale(.96);}
.go-score{font-family:'Chakra Petch';font-weight:700;font-size:3.2rem;color:#eafcff;
  text-shadow:0 0 22px rgba(38,227,255,.6);line-height:1;margin:6px 0;}
.go-label{font-size:.7rem;letter-spacing:.3em;color:var(--ink-dim);text-transform:uppercase;}
.newbest{color:var(--gold);font-weight:700;letter-spacing:.18em;margin-top:8px;
  text-shadow:0 0 14px rgba(255,210,90,.6);animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.4;}}
.go-stats{margin-top:14px;font-size:.84rem;color:var(--ink-dim);line-height:1.9;}
.go-stats b{color:var(--ink);}
.row2{display:flex;gap:12px;margin-top:26px;}
.minbtn{padding:13px 28px;border-radius:12px;border:1px solid rgba(38,227,255,.3);
  background:rgba(10,16,38,.6);color:var(--ink);font-family:inherit;font-weight:600;font-size:.92rem;
  letter-spacing:.05em;cursor:pointer;}
.minbtn.pri{border-color:var(--magenta);color:#ffd6f6;
  background:linear-gradient(100deg,rgba(255,43,214,.25),rgba(255,43,214,.06));
  box-shadow:0 0 22px rgba(255,43,214,.25);text-shadow:0 0 10px rgba(255,43,214,.5);}
.minbtn:active{transform:scale(.95);}
.flash{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:#fff;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<canvas id="game"></canvas>
<div class="danger" id="dangerOverlay"></div>
<div class="flash" id="flash"></div>

<div id="hud">
  <div class="hud-top">
    <div class="score-wrap">
      <div class="score" id="score">0</div>
      <div class="best">BEST <b id="best">0</b></div>
    </div>
    <div class="ctrls">
      <div class="ic" id="sndBtn">🔇</div>
      <div class="ic" id="pauseBtn">⏸</div>
    </div>
  </div>
  <div class="hp">
    <span class="lbl">CORE</span>
    <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
  </div>
  <div class="combo" id="combo"><span class="x" id="comboX">×1</span> <span class="c" id="comboC">COMBO 0</span></div>
</div>
<div class="buffs" id="buffs"></div>
<div class="wave" id="waveBanner"></div>

<!-- MENU -->
<div class="screen show" id="menu">
  <div class="title">NEON <b>STATION</b></div>
  <div class="sub">// Core Defense</div>
  <div class="howto">
    <div class="row"><span class="dot">🪨</span>迫る隕石を<b>タップで撃破</b>してコアを守れ</div>
    <div class="row"><span class="dot" style="color:var(--red);border-color:rgba(255,70,95,.5)">✦</span><b style="color:var(--red)">赤い地雷はタップ厳禁</b>（押すと自爆ダメージ）</div>
    <div class="row"><span class="dot" style="color:var(--lime)">◈</span>光る<b>パワーアップ</b>を拾って形勢逆転</div>
    <div class="row"><span class="dot" style="color:var(--gold)">⚡</span>連続撃破で<b>コンボ倍率UP</b></div>
  </div>
  <button class="bigbtn" id="startBtn">▶ START</button>
  <div class="best" style="margin-top:18px">BEST SCORE <b id="bestMenu">0</b></div>
</div>

<!-- GAME OVER -->
<div class="screen" id="over">
  <div class="title" style="font-size:1.3rem;color:var(--red);text-shadow:0 0 20px rgba(255,70,95,.6)">⚠ CORE BREACH</div>
  <div class="go-label" style="margin-top:18px">SCORE</div>
  <div class="go-score" id="finalScore">0</div>
  <div class="newbest" id="newBest" style="display:none">★ NEW BEST ★</div>
  <div class="go-stats" id="goStats"></div>
  <div class="row2">
    <button class="minbtn" id="menuBtn">MENU</button>
    <button class="minbtn pri" id="retryBtn">RETRY ▶</button>
  </div>
</div>

<div class="scan"></div>
<div class="vig"></div>

<script>
"use strict";
/* ============================================================
   NEON STATION // CORE DEFENSE
   reflex arcade shooter · tap incoming enemies to protect the core
   single file · vanilla JS + canvas · localStorage high score
   ============================================================ */
const SAVE_KEY='neon-defense-v1';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

/* ---- canvas ---- */
const gc=$('#game'), g=gc.getContext('2d');
let W=0,H=0,CX=0,CY=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight; CX=W/2; CY=H/2;
  gc.width=W*DPR; gc.height=H*DPR; gc.style.width=W+'px'; gc.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

/* ---- persistent ---- */
let best=0, sound=false;
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); best=s.best||0; sound=!!s.sound; }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify({best,sound})); }catch(e){} }

/* ---- game state ---- */
const CORE_R=34, SHIELD_R=58, MAXHP=10;
let state='menu';                 // menu | play | pause | over
let enemies, particles, powerups, floats;
let hp, score, combo, mult, elapsed, wave, spawnTimer, powerTimer;
let timeScale, slowT, odT;        // slow-mo & overdrive timers
let shake, flashT, coreHitT;

function reset(){
  enemies=[]; particles=[]; powerups=[]; floats=[];
  hp=MAXHP; score=0; combo=0; mult=1; elapsed=0; wave=0;
  spawnTimer=0.8; powerTimer=10; timeScale=1; slowT=0; odT=0;
  shake=0; flashT=0; coreHitT=0;
  $('#dangerOverlay').classList.remove('on');
}

/* ============================================================
   ENEMY TYPES
   ============================================================ */
const TYPES={
  asteroid:{r:21, speed:62,  hp:1, pts:10, col:'#9fd8ff'},
  comet:   {r:14, speed:118, hp:1, pts:25, col:'#ff2bd6'},
  armored: {r:25, speed:46,  hp:2, pts:40, col:'#7fffd0'},
  splitter:{r:22, speed:70,  hp:1, pts:15, col:'#8dff6b'},
  fragment:{r:12, speed:135, hp:1, pts:8,  col:'#8dff6b'},
  mine:    {r:19, speed:54,  hp:1, pts:0,  col:'#ff465f'},
};
function spawnWeights(){
  const e=elapsed;
  return {
    asteroid:1,
    comet:    e>14?0.55:0,
    mine:     e>20?0.45:0,
    armored:  e>32?0.45:0,
    splitter: e>48?0.4:0,
  };
}
function pickType(){
  const w=spawnWeights(); let tot=0; for(const k in w) tot+=w[k];
  let r=Math.random()*tot;
  for(const k in w){ r-=w[k]; if(r<=0) return k; }
  return 'asteroid';
}
function speedMul(){ return Math.min(2.8, 1+elapsed/75); }

function spawnEnemy(type,x,y,extra){
  type=type||pickType();
  const t=TYPES[type];
  if(x===undefined){
    // spawn just outside a random edge
    const m=40, side=Math.floor(Math.random()*4);
    if(side===0){ x=rand(-m,W+m); y=-m; }
    else if(side===1){ x=W+m; y=rand(-m,H+m); }
    else if(side===2){ x=rand(-m,W+m); y=H+m; }
    else { x=-m; y=rand(-m,H+m); }
  }
  const ang=Math.atan2(CY-y,CX-x);
  const sp=t.speed*speedMul()*(extra&&extra.sp||1);
  enemies.push({
    type,x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
    r:t.r*(extra&&extra.rs||1), hp:t.hp, maxhp:t.hp, col:t.col,
    spin:rand(0,TAU), spv:rand(-2,2), seed:rand(0,99), trail:[],
  });
}

/* ============================================================
   POWERUPS
   ============================================================ */
const POWERS={
  slow:    {col:'#26e3ff', label:'スロー'},
  nuke:    {col:'#ffd25a', label:'核'},
  repair:  {col:'#8dff6b', label:'修理'},
  overdrive:{col:'#ff2bd6',label:'倍率2倍'},
};
function spawnPower(){
  const keys=Object.keys(POWERS);
  const kind=keys[Math.floor(Math.random()*keys.length)];
  // drift across the screen
  const horiz=Math.random()<0.5;
  let x,y,vx,vy; const sp=rand(55,80);
  if(horiz){ const l2r=Math.random()<0.5; x=l2r?-30:W+30; y=rand(H*0.2,H*0.8); vx=(l2r?1:-1)*sp; vy=rand(-12,12); }
  else { const t2b=Math.random()<0.5; y=t2b?-30:H+30; x=rand(W*0.2,W*0.8); vy=(t2b?1:-1)*sp; vx=rand(-12,12); }
  powerups.push({kind,x,y,vx,vy,r:20,t:0,col:POWERS[kind].col});
}
function applyPower(kind){
  const p=POWERS[kind];
  if(kind==='slow'){ slowT=4.2; addFloat(CX,CY-90,'⏱ スロー',p.col); }
  else if(kind==='repair'){ hp=Math.min(MAXHP,hp+3); addFloat(CX,CY-90,'＋ コア修復',p.col); }
  else if(kind==='overdrive'){ odT=6.5; addFloat(CX,CY-90,'⚡ オーバードライブ',p.col); }
  else if(kind==='nuke'){
    let n=0;
    for(const e of enemies){ if(e.type!=='mine'){ addScore(e,e.x,e.y); } burst(e.x,e.y,e.col,16); n++; }
    enemies=[];
    shake=Math.max(shake,16); flash(0.6); addFloat(CX,CY-90,'💥 全消去!',p.col);
  }
  beep(kind==='nuke'?160:740,0.06,'triangle');
  vibrate(kind==='repair'?20:14);
}

/* ============================================================
   PARTICLES / FLOATS
   ============================================================ */
function burst(x,y,col,n){
  n=n||10;
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), s=rand(40,220);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.7),t:0,col,r:rand(1.5,3.5)});
  }
}
function ring(x,y,col){ particles.push({ring:true,x,y,r:6,vr:260,life:.4,t:0,col}); }
function addFloat(x,y,txt,col){ floats.push({x,y,txt,col,t:0,life:1.0}); }

/* ============================================================
   SCORING
   ============================================================ */
function recalcMult(){ mult=1+Math.floor(combo/5)*0.5; if(mult>6)mult=6; }
function addScore(e,x,y){
  const base=TYPES[e.type].pts;
  const got=Math.round(base*mult*(odT>0?2:1));
  score+=got;
  if(got>0) addFloat(x,y,'+'+got,'#eafcff');
}

/* ============================================================
   INPUT — tap to shoot
   ============================================================ */
function onPointer(ev){
  if(state==='menu'||state==='over'){ return; }
  if(state==='pause'){ return; }
  ev.preventDefault();
  const pt=ev.touches?ev.touches[0]:ev;
  const x=pt.clientX, y=pt.clientY;
  // 1) powerups first (bigger reward)
  let pi=-1, pbest=1e9;
  for(let i=0;i<powerups.length;i++){ const p=powerups[i]; const d=dist2(x,y,p.x,p.y); const rr=(p.r+22)**2; if(d<rr&&d<pbest){pbest=d;pi=i;} }
  if(pi>=0){ const p=powerups[pi]; applyPower(p.kind); ring(p.x,p.y,p.col); powerups.splice(pi,1); return; }
  // 2) enemies — closest within forgiving radius
  let ei=-1, ebest=1e9;
  for(let i=0;i<enemies.length;i++){ const e=enemies[i]; const pad=e.r+16; const d=dist2(x,y,e.x,e.y); if(d<pad*pad&&d<ebest){ebest=d;ei=i;} }
  if(ei<0){ return; } // empty tap — no penalty
  const e=enemies[ei];
  if(e.type==='mine'){
    // tapped a mine — bad!
    enemies.splice(ei,1);
    burst(e.x,e.y,'#ff465f',22); ring(e.x,e.y,'#ff465f');
    hp=Math.max(0,hp-2); combo=0; recalcMult();
    shake=Math.max(shake,18); flash(0.5,'#ff465f'); vibrate([30,40,30]);
    coreHitT=0.4; addFloat(e.x,e.y,'地雷! -2','#ff465f');
    beep(120,0.12,'sawtooth');
    if(hp<=0) gameOver();
    return;
  }
  e.hp--;
  burst(e.x,e.y,e.col,e.hp>0?5:12);
  beep(e.hp>0?300:520+combo*4,0.04,'square');
  if(e.hp<=0){
    addScore(e,e.x,e.y);
    combo++; recalcMult();
    if(e.type==='splitter'){
      for(let k=0;k<2;k++){ spawnEnemy('fragment', e.x, e.y, {sp:rand(.9,1.3)}); }
    }
    ring(e.x,e.y,e.col);
    enemies.splice(ei,1);
    vibrate(7);
  } else {
    e.flash=0.12; vibrate(5);
  }
}
gc.addEventListener('pointerdown',onPointer,{passive:false});

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  // timers (real time)
  if(slowT>0){ slowT-=dt; }
  if(odT>0){ odT-=dt; }
  timeScale=slowT>0?0.38:1;
  if(shake>0) shake=Math.max(0,shake-dt*60);
  if(flashT>0) flashT=Math.max(0,flashT-dt*3);
  if(coreHitT>0) coreHitT-=dt;

  if(state!=='play') return;

  elapsed+=dt;
  const gdt=dt*timeScale; // game-time for movement/spawn

  // wave banner
  const w=Math.floor(elapsed/20)+1;
  if(w!==wave){ wave=w; if(wave>1) showWave(wave); }

  // spawning
  spawnTimer-=gdt;
  if(spawnTimer<=0){
    spawnEnemy();
    if(elapsed>60 && Math.random()<0.25) spawnEnemy(); // double spawns later
    const interval=Math.max(0.34,1.05-elapsed*0.0055);
    spawnTimer=interval*rand(0.7,1.3);
  }
  powerTimer-=dt;
  if(powerTimer<=0){ spawnPower(); powerTimer=rand(11,17); }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.flash>0) e.flash-=dt;
    e.spin+=e.spv*gdt;
    if(e.type==='comet'||e.type==='fragment'){ e.trail.push({x:e.x,y:e.y}); if(e.trail.length>7)e.trail.shift(); }
    e.x+=e.vx*gdt; e.y+=e.vy*gdt;
    const d=Math.hypot(e.x-CX,e.y-CY);
    if(d<SHIELD_R+e.r*0.5){
      // reached the core
      if(e.type==='mine'){
        // inert vs core — shield deflects it harmlessly
        burst(e.x,e.y,'#5a6b8a',8); enemies.splice(i,1); continue;
      }
      enemies.splice(i,1);
      hp=Math.max(0,hp-1); combo=0; recalcMult();
      burst(e.x,e.y,'#ff465f',14); ring(CX,CY,'#ff465f');
      shake=Math.max(shake,12); coreHitT=0.4; vibrate([20,30]);
      beep(140,0.08,'sawtooth');
      if(hp<=0){ gameOver(); return; }
    }
  }

  // powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<-60||p.x>W+60||p.y<-60||p.y>H+60) powerups.splice(i,1);
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    if(p.t>=p.life){ particles.splice(i,1); continue; }
    if(p.ring){ p.r+=p.vr*dt; }
    else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; }
  }
  // floats
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=dt; f.y-=24*dt; if(f.t>=f.life) floats.splice(i,1);
  }

  // danger overlay when low hp
  $('#dangerOverlay').classList.toggle('on',hp<=3);
}

/* ============================================================
   RENDER
   ============================================================ */
function draw(){
  g.clearRect(0,0,W,H);
  g.save();
  if(shake>0){ g.translate(rand(-shake,shake),rand(-shake,shake)); }

  drawCore();

  // powerups
  for(const p of powerups) drawPower(p);
  // enemies
  for(const e of enemies) drawEnemy(e);
  // particles
  for(const p of particles) drawParticle(p);

  g.restore();

  // floats (no shake) — drawn in screen space
  g.save();
  for(const f of floats){
    const a=1-f.t/f.life;
    g.globalAlpha=a; g.fillStyle=f.col;
    g.font='700 '+(15+ (1-a)*6)+'px Chakra Petch, sans-serif';
    g.textAlign='center'; g.shadowBlur=10; g.shadowColor=f.col;
    g.fillText(f.txt,f.x,f.y);
  }
  g.restore();
  g.globalAlpha=1; g.shadowBlur=0;

  if(flashT>0){ $('#flash').style.opacity=flashT*0.5; }
  else $('#flash').style.opacity=0;
}

function drawCore(){
  const t=performance.now()/1000;
  const breach=coreHitT>0;
  // shield ring
  g.save();
  g.globalAlpha=0.5+0.2*Math.sin(t*2);
  g.strokeStyle=breach?'#ff465f':'rgba(38,227,255,.5)'; g.lineWidth=2;
  g.shadowBlur=18; g.shadowColor=breach?'#ff465f':'#26e3ff';
  g.beginPath(); g.arc(CX,CY,SHIELD_R,0,TAU); g.stroke();
  // rotating dashed ring
  g.globalAlpha=0.6; g.setLineDash([6,10]); g.lineDashOffset=-t*30;
  g.beginPath(); g.arc(CX,CY,SHIELD_R-9,0,TAU); g.stroke(); g.setLineDash([]);
  g.restore();
  // HP arc
  g.save();
  const frac=hp/MAXHP;
  g.lineWidth=4; g.lineCap='round';
  const hpcol = frac>0.5?'#8dff6b':frac>0.25?'#ffd25a':'#ff465f';
  g.strokeStyle=hpcol; g.shadowBlur=12; g.shadowColor=hpcol;
  g.beginPath(); g.arc(CX,CY,SHIELD_R+8,-Math.PI/2,-Math.PI/2+TAU*frac); g.stroke();
  g.restore();
  // core body
  g.save();
  const pulse=1+0.05*Math.sin(t*4)+(breach?0.12:0);
  const grd=g.createRadialGradient(CX-8,CY-10,4,CX,CY,CORE_R*pulse);
  grd.addColorStop(0,'#eafcff'); grd.addColorStop(.3,breach?'#ff7a8a':'#46d8ff');
  grd.addColorStop(.7,breach?'#c01f33':'#1786c9'); grd.addColorStop(1,'#08234a');
  g.fillStyle=grd; g.shadowBlur=34; g.shadowColor=breach?'#ff465f':'#26e3ff';
  g.beginPath(); g.arc(CX,CY,CORE_R*pulse,0,TAU); g.fill();
  // inner core spark
  g.globalAlpha=0.9; g.fillStyle='#fff'; g.shadowBlur=10;
  g.beginPath(); g.arc(CX-7,CY-8,4,0,TAU); g.fill();
  g.restore();
}

function poly(cx,cy,r,sides,rot,jitterSeed){
  g.beginPath();
  for(let i=0;i<sides;i++){
    const a=rot+i/sides*TAU;
    const jr=r*(1+(jitterSeed!==undefined?0.18*Math.sin(jitterSeed+i*1.7):0));
    const x=cx+Math.cos(a)*jr, y=cy+Math.sin(a)*jr;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
}

function drawEnemy(e){
  const t=e.type;
  // trails for fast ones
  if(e.trail&&e.trail.length){
    for(let i=0;i<e.trail.length;i++){
      const tp=e.trail[i], a=i/e.trail.length*0.5;
      g.globalAlpha=a; g.fillStyle=e.col; g.beginPath();
      g.arc(tp.x,tp.y,e.r*0.5*(i/e.trail.length),0,TAU); g.fill();
    }
    g.globalAlpha=1;
  }
  g.save();
  g.shadowBlur=16; g.shadowColor=e.col;
  if(t==='asteroid'){
    g.fillStyle='rgba(20,40,66,.9)'; g.strokeStyle=e.col; g.lineWidth=2.5;
    poly(e.x,e.y,e.r,8,e.spin,e.seed); g.fill(); g.stroke();
    g.shadowBlur=0; g.fillStyle=e.col; g.globalAlpha=.6;
    g.beginPath(); g.arc(e.x-e.r*0.3,e.y-e.r*0.3,e.r*0.22,0,TAU); g.fill();
  } else if(t==='comet'){
    g.fillStyle='#fff'; g.strokeStyle=e.col; g.lineWidth=2;
    g.beginPath(); g.arc(e.x,e.y,e.r,0,TAU); g.fill();
    g.shadowBlur=20; g.beginPath(); g.arc(e.x,e.y,e.r*0.6,0,TAU);
    g.fillStyle=e.col; g.fill();
  } else if(t==='armored'){
    g.fillStyle='rgba(14,46,40,.92)'; g.strokeStyle=e.col; g.lineWidth=3;
    poly(e.x,e.y,e.r,6,e.spin); g.fill(); g.stroke();
    g.lineWidth=2; g.strokeStyle='rgba(127,255,208,.5)';
    poly(e.x,e.y,e.r*0.55,6,e.spin); g.stroke();
    if(e.hp<e.maxhp){ g.strokeStyle='#fff'; g.lineWidth=2; g.beginPath();
      g.moveTo(e.x-e.r*0.5,e.y-e.r*0.3); g.lineTo(e.x+e.r*0.2,e.y+e.r*0.5); g.stroke(); }
  } else if(t==='splitter'||t==='fragment'){
    const wob=1+0.12*Math.sin(performance.now()/120+e.seed);
    g.fillStyle='rgba(20,60,18,.85)'; g.strokeStyle=e.col; g.lineWidth=2.5;
    g.beginPath(); g.arc(e.x,e.y,e.r*wob,0,TAU); g.fill(); g.stroke();
    g.fillStyle=e.col; g.globalAlpha=.5;
    g.beginPath(); g.arc(e.x,e.y,e.r*0.4*wob,0,TAU); g.fill();
  } else if(t==='mine'){
    const p=0.5+0.5*Math.sin(performance.now()/110+e.seed);
    g.shadowBlur=14+10*p; g.shadowColor='#ff465f';
    g.fillStyle='rgba(60,10,18,.92)'; g.strokeStyle='#ff465f'; g.lineWidth=2.5;
    // spiky star
    g.beginPath();
    for(let i=0;i<12;i++){ const a=e.spin+i/12*TAU; const rr=i%2?e.r*1.35:e.r*0.7;
      const x=e.x+Math.cos(a)*rr,y=e.y+Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.closePath(); g.fill(); g.stroke();
    // warning core
    g.fillStyle='#ff465f'; g.globalAlpha=.6+0.4*p; g.shadowBlur=12;
    g.beginPath(); g.arc(e.x,e.y,e.r*0.4,0,TAU); g.fill();
  }
  g.restore(); g.globalAlpha=1; g.shadowBlur=0;
}

function drawPower(p){
  const t=performance.now()/1000;
  g.save();
  g.translate(p.x,p.y);
  const s=1+0.1*Math.sin(t*5+p.t);
  g.scale(s,s);
  g.shadowBlur=24; g.shadowColor=p.col;
  // outer ring
  g.strokeStyle=p.col; g.lineWidth=3; g.globalAlpha=0.95;
  g.beginPath(); g.arc(0,0,p.r,0,TAU); g.stroke();
  g.setLineDash([4,6]); g.lineDashOffset=-t*40;
  g.beginPath(); g.arc(0,0,p.r+6,0,TAU); g.stroke(); g.setLineDash([]);
  // fill glow
  const grd=g.createRadialGradient(0,0,2,0,0,p.r);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(.5,p.col); grd.addColorStop(1,'rgba(0,0,0,0)');
  g.globalAlpha=0.55; g.fillStyle=grd; g.beginPath(); g.arc(0,0,p.r,0,TAU); g.fill();
  // icon
  g.globalAlpha=1; g.strokeStyle='#05060f'; g.fillStyle='#05060f'; g.lineWidth=3; g.lineCap='round';
  g.shadowBlur=0;
  const k=p.kind, r=p.r*0.5;
  if(k==='slow'){ // snowflake / clock asterisk
    for(let i=0;i<3;i++){ const a=i/3*Math.PI; g.beginPath();
      g.moveTo(-Math.cos(a)*r,-Math.sin(a)*r); g.lineTo(Math.cos(a)*r,Math.sin(a)*r); g.stroke(); }
  } else if(k==='repair'){ // plus
    g.beginPath(); g.moveTo(-r,0); g.lineTo(r,0); g.moveTo(0,-r); g.lineTo(0,r); g.stroke();
  } else if(k==='nuke'){ // starburst
    g.beginPath(); for(let i=0;i<8;i++){ const a=i/8*TAU; g.moveTo(0,0); g.lineTo(Math.cos(a)*r,Math.sin(a)*r);} g.stroke();
    g.beginPath(); g.arc(0,0,r*0.35,0,TAU); g.fill();
  } else if(k==='overdrive'){ // lightning
    g.beginPath(); g.moveTo(r*0.3,-r); g.lineTo(-r*0.4,r*0.1); g.lineTo(r*0.05,r*0.1); g.lineTo(-r*0.3,r);
    g.lineWidth=4; g.lineJoin='round'; g.stroke();
  }
  g.restore(); g.globalAlpha=1; g.shadowBlur=0;
}

function drawParticle(p){
  const a=1-p.t/p.life;
  g.globalAlpha=a;
  if(p.ring){
    g.strokeStyle=p.col; g.lineWidth=3*a; g.shadowBlur=12; g.shadowColor=p.col;
    g.beginPath(); g.arc(p.x,p.y,p.r,0,TAU); g.stroke();
  } else {
    g.fillStyle=p.col; g.shadowBlur=8; g.shadowColor=p.col;
    g.beginPath(); g.arc(p.x,p.y,p.r,0,TAU); g.fill();
  }
  g.globalAlpha=1; g.shadowBlur=0;
}

/* ============================================================
   HUD
   ============================================================ */
const scoreEl=$('#score'), comboEl=$('#combo'), comboX=$('#comboX'), comboC=$('#comboC'),
      hpfill=$('#hpfill'), buffsEl=$('#buffs');
let shownScore=0;
function hud(){
  // animate score toward value
  shownScore+=(score-shownScore)*0.25; if(Math.abs(score-shownScore)<1) shownScore=score;
  scoreEl.textContent=Math.round(shownScore).toLocaleString();
  hpfill.style.transform='scaleX('+(hp/MAXHP)+')';
  if(combo>1){ comboEl.classList.add('on'); comboX.textContent='×'+(mult%1?mult.toFixed(1):mult);
    comboC.textContent='COMBO '+combo; }
  else comboEl.classList.remove('on');
  // buffs
  let b='';
  if(slowT>0) b+='<div class="buff" style="border-color:#26e3ff;color:#26e3ff">⏱ スロー '+slowT.toFixed(1)+'</div>';
  if(odT>0)   b+='<div class="buff" style="border-color:#ff2bd6;color:#ff2bd6">⚡ ×2 '+odT.toFixed(1)+'</div>';
  buffsEl.innerHTML=b;
}

function showWave(n){
  const el=$('#waveBanner'); el.textContent='WAVE '+n;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  beep(560,0.05,'triangle');
}

/* ============================================================
   FX helpers
   ============================================================ */
function flash(v,col){ flashT=v; $('#flash').style.background=col||'#fff'; }
function vibrate(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }
let actx=null;
function beep(freq,gain,type){
  if(!sound) return;
  try{ actx=actx||new (AudioContext||webkitAudioContext)();
    const o=actx.createOscillator(),gg=actx.createGain();
    o.type=type||'square'; o.frequency.value=freq; gg.gain.value=gain;
    o.connect(gg); gg.connect(actx.destination); o.start();
    gg.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.16); o.stop(actx.currentTime+0.18);
  }catch(e){}
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame(){
  reset(); state='play';
  $('#menu').classList.remove('show'); $('#over').classList.remove('show');
  shownScore=0;
}
function gameOver(){
  state='over';
  burst(CX,CY,'#ff465f',40); ring(CX,CY,'#ff465f'); shake=22; flash(0.8,'#ff465f');
  vibrate([40,60,40,60]); beep(90,0.14,'sawtooth');
  const isBest=score>best; if(isBest){ best=score; }
  persist();
  $('#finalScore').textContent=score.toLocaleString();
  $('#newBest').style.display=isBest?'':'none';
  $('#goStats').innerHTML='WAVE <b>'+wave+'</b> 到達 ・ BEST <b>'+best.toLocaleString()+'</b>';
  $('#best').textContent=best.toLocaleString();
  $('#bestMenu').textContent=best.toLocaleString();
  setTimeout(()=>$('#over').classList.add('show'),550);
}
function toMenu(){
  state='menu'; $('#over').classList.remove('show'); $('#menu').classList.add('show');
  $('#bestMenu').textContent=best.toLocaleString();
}
function togglePause(){
  if(state==='play'){ state='pause'; $('#pauseBtn').textContent='▶'; }
  else if(state==='pause'){ state='play'; $('#pauseBtn').textContent='⏸'; lastT=performance.now(); }
}

/* ---- wire buttons ---- */
$('#startBtn').addEventListener('click',startGame);
$('#retryBtn').addEventListener('click',startGame);
$('#menuBtn').addEventListener('click',toMenu);
$('#pauseBtn').addEventListener('click',togglePause);
$('#sndBtn').addEventListener('click',()=>{ sound=!sound; $('#sndBtn').textContent=sound?'🔊':'🔇';
  if(sound){ actx=null; beep(700,0.05); } persist(); });
$('#sndBtn').textContent=sound?'🔊':'🔇';
$('#best').textContent=best.toLocaleString(); $('#bestMenu').textContent=best.toLocaleString();

/* ============================================================
   STARFIELD (bg canvas)
   ============================================================ */
const sc=$('#stars'), sx=sc.getContext('2d'); let stars=[];
function sResize(){ sc.width=innerWidth*DPR; sc.height=innerHeight*DPR; sx.setTransform(DPR,0,0,DPR,0,0);
  const n=Math.min(140,Math.floor(innerWidth*innerHeight/9000));
  stars=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*0.8+0.2,tw:Math.random()*TAU}));
}
addEventListener('resize',sResize); sResize();
function drawStars(t){
  sx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){ s.y+=s.z*0.1; if(s.y>innerHeight){s.y=0;s.x=Math.random()*innerWidth;}
    const a=0.3+0.5*Math.abs(Math.sin(t*0.001+s.tw));
    sx.beginPath(); sx.fillStyle=s.z>0.7?`rgba(180,245,255,${a})`:`rgba(120,170,255,${a*0.8})`;
    sx.arc(s.x,s.y,s.z*1.4,0,TAU); sx.fill(); }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
reset(); // initialise arrays so menu-screen rendering has valid state
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  drawStars(now);
  update(dt);
  draw();
  hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') togglePause(); });

/* expose for automated testing */
window.GAME={get state(){return state;},get score(){return score;},get hp(){return hp;},
  get enemies(){return enemies;},get powerups(){return powerups;},get combo(){return combo;},
  start:startGame, spawnEnemy, spawnPower};
</script>
